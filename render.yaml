services:
  - type: web
    name: zecwild
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npx prisma db push && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: ZECHACK_WEBHOOK_SECRET
        generateValue: true
